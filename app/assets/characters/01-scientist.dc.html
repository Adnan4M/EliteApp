<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f1ea;font-family:-apple-system,Helvetica,Arial,sans-serif;">
  <div style="display:flex;align-items:center;gap:16px;background:#eef4ef;border-radius:12px;padding:16px 20px;width:320px;">
    <div style="flex:1;text-align:right;">
      <p style="margin:0;font-size:16px;font-weight:600;color:#1c1c1c;">Scientist</p>
      <p style="margin:4px 0 0;font-size:13px;color:#7a8079;">Word Atlas</p>
    </div>
    <div style="position:relative;width:64px;height:64px;flex-shrink:0;">
      <div style="width:64px;height:64px;border-radius:50%;background:#c62f2f;overflow:hidden;position:relative;">
        <div style="position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:48px;height:34px;border-radius:24px 24px 0 0;background:#f7f2e6;"></div>
        <div style="position:absolute;top:14px;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;background:#f7f2e6;">
          <div style="position:absolute;top:16px;left:50%;transform:translateX(-50%);width:9px;height:4px;border-bottom:1.5px solid #a5764f;border-radius:0 0 9px 9px;"></div>
        </div>
        <div style="position:absolute;top:13px;left:calc(50% - 21px);width:15px;height:15px;border-radius:50%;background:#9aa3ad;"></div>
        <div style="position:absolute;top:13px;right:calc(50% - 21px);width:15px;height:15px;border-radius:50%;background:#9aa3ad;"></div>
        <div style="position:absolute;top:7px;left:calc(50% - 13px);width:12px;height:12px;border-radius:50%;background:#9aa3ad;"></div>
        <div style="position:absolute;top:4px;left:50%;transform:translateX(-50%);width:13px;height:13px;border-radius:50%;background:#9aa3ad;"></div>
        <div style="position:absolute;top:7px;right:calc(50% - 13px);width:12px;height:12px;border-radius:50%;background:#9aa3ad;"></div>
        <div style="position:absolute;top:24px;left:calc(50% - 11px);width:10px;height:10px;border-radius:50%;border:2px solid #2a2a28;background:rgba(255,255,255,0.45);"></div>
        <div style="position:absolute;top:24px;right:calc(50% - 11px);width:10px;height:10px;border-radius:50%;border:2px solid #2a2a28;background:rgba(255,255,255,0.45);"></div>
        <div style="position:absolute;top:28px;left:calc(50% - 7px);width:3px;height:3px;border-radius:50%;background:#2a2a28;"></div>
        <div style="position:absolute;top:28px;right:calc(50% - 7px);width:3px;height:3px;border-radius:50%;background:#2a2a28;"></div>
        <div style="position:absolute;top:28px;left:50%;transform:translateX(-50%);width:5px;height:2px;background:#2a2a28;"></div>
      </div>
      <div style="position:absolute;bottom:-2px;right:-2px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid #eef4ef;display:flex;align-items:center;justify-content:center;">
        <div style="position:relative;width:12px;height:15px;">
          <div style="position:absolute;top:0;left:4px;width:4px;height:5px;background:#c62f2f;"></div>
          <div style="position:absolute;bottom:0;left:0;width:12px;height:10px;background:#c62f2f;clip-path:polygon(30% 0%,70% 0%,100% 100%,0% 100%);border-radius:0 0 3px 3px;"></div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
