<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f1ea;font-family:-apple-system,Helvetica,Arial,sans-serif;">
  <div style="display:flex;align-items:center;gap:16px;background:#eef4ef;border-radius:12px;padding:16px 20px;width:320px;">
    <div style="flex:1;text-align:right;">
      <p style="margin:0;font-size:16px;font-weight:600;color:#1c1c1c;">Cell</p>
      <p style="margin:4px 0 0;font-size:13px;color:#7a8079;">Word Atlas</p>
    </div>
    <div style="position:relative;width:64px;height:64px;flex-shrink:0;">
      <div style="width:64px;height:64px;border-radius:50%;background:#6bc62f;overflow:hidden;position:relative;">
        <div style="position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:48px;height:34px;border-radius:24px 24px 0 0;background:#f7f2e6;"></div>
        <div style="position:absolute;top:14px;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;background:#f7f2e6;">
          <div style="position:absolute;top:11px;left:6px;width:3px;height:3px;border-radius:50%;background:#2a2a28;"></div>
          <div style="position:absolute;top:11px;right:6px;width:3px;height:3px;border-radius:50%;background:#2a2a28;"></div>
          <div style="position:absolute;top:17px;left:50%;transform:translateX(-50%);width:8px;height:3px;border-bottom:1.5px solid #a5764f;border-radius:0 0 8px 8px;"></div>
        </div>
        <div style="position:absolute;top:2px;left:50%;transform:translateX(-50%);width:32px;height:22px;border-radius:50%;background:#3f7a22;"></div>
        <div style="position:absolute;top:7px;left:calc(50% - 9px);width:6px;height:6px;border-radius:50%;background:#a8e07a;"></div>
        <div style="position:absolute;top:5px;right:calc(50% - 11px);width:4px;height:4px;border-radius:50%;background:#a8e07a;"></div>
        <div style="position:absolute;top:12px;left:calc(50% + 2px);width:5px;height:5px;border-radius:50%;background:#a8e07a;"></div>
        <div style="position:absolute;top:44px;left:50%;transform:translateX(-50%);width:38px;height:5px;background:#6bc62f;border-radius:2px;"></div>
        <div style="position:absolute;top:16px;left:calc(50% - 9px);width:4px;height:4px;border-radius:50%;background:#6bc62f;opacity:0.6;"></div>
        <div style="position:absolute;top:23px;right:calc(50% - 8px);width:3px;height:3px;border-radius:50%;background:#6bc62f;opacity:0.6;"></div>
      </div>
      <div style="position:absolute;bottom:-2px;right:-2px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid #eef4ef;display:flex;align-items:center;justify-content:center;">
        <div style="position:relative;width:14px;height:10px;border:1.5px solid #6bc62f;border-radius:50%;">
          <div style="position:absolute;top:2px;left:2px;width:3px;height:3px;border-radius:50%;background:#6bc62f;"></div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
