<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f1ea;font-family:-apple-system,Helvetica,Arial,sans-serif;">
  <div style="display:flex;align-items:center;gap:16px;background:#eef4ef;border-radius:12px;padding:16px 20px;width:320px;">
    <div style="flex:1;text-align:right;">
      <p style="margin:0;font-size:16px;font-weight:600;color:#1c1c1c;">Star</p>
      <p style="margin:4px 0 0;font-size:13px;color:#7a8079;">Word Atlas</p>
    </div>
    <div style="position:relative;width:64px;height:64px;flex-shrink:0;">
      <div style="width:64px;height:64px;border-radius:50%;background:#c66b2f;overflow:hidden;position:relative;">
        <div style="position:absolute;top:4px;left:50%;transform:translateX(-50%) rotate(-8deg);width:30px;height:30px;background:#ffd93d;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);"></div>
        <div style="position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:52px;height:32px;border-radius:26px 26px 0 0;background:#3b2f57;"></div>
        <div style="position:absolute;bottom:0px;left:50%;transform:translateX(-50%);width:16px;height:20px;background:#f7f2e6;border-radius:8px 8px 0 0;"></div>
        <div style="position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:10px;height:10px;background:#ffd93d;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);"></div>
        <div style="position:absolute;top:18px;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;background:#f0c9a0;">
          <div style="position:absolute;top:8px;left:2px;width:9px;height:7px;border-radius:4px;background:#1b1b1b;"></div>
          <div style="position:absolute;top:8px;right:2px;width:9px;height:7px;border-radius:4px;background:#1b1b1b;"></div>
          <div style="position:absolute;top:10px;left:50%;transform:translateX(-50%);width:6px;height:2px;background:#1b1b1b;"></div>
          <div style="position:absolute;top:9px;left:3px;width:3px;height:2px;border-radius:2px;background:#6f6f6f;"></div>
          <div style="position:absolute;top:18px;left:50%;transform:translateX(-50%);width:11px;height:6px;background:#8c4a3a;border-radius:0 0 11px 11px;"></div>
          <div style="position:absolute;top:16px;left:2px;width:5px;height:3px;border-radius:3px;background:#e09a7a;"></div>
          <div style="position:absolute;top:16px;right:2px;width:5px;height:3px;border-radius:3px;background:#e09a7a;"></div>
        </div>
      </div>
      <div style="position:absolute;bottom:-2px;right:-2px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid #eef4ef;display:flex;align-items:center;justify-content:center;">
        <div style="position:relative;width:8px;height:14px;">
          <div style="position:absolute;top:0;left:0;width:8px;height:9px;border-radius:4px;background:#c66b2f;"></div>
          <div style="position:absolute;bottom:0;left:3px;width:2px;height:5px;background:#c66b2f;"></div>
          <div style="position:absolute;bottom:0;left:0px;width:8px;height:2px;border-radius:1px;background:#c66b2f;"></div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
