<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f1ea;font-family:-apple-system,Helvetica,Arial,sans-serif;">
  <div style="display:flex;align-items:center;gap:16px;background:#eef4ef;border-radius:12px;padding:16px 20px;width:320px;">
    <div style="flex:1;text-align:right;">
      <p style="margin:0;font-size:16px;font-weight:600;color:#1c1c1c;">Galaxy</p>
      <p style="margin:4px 0 0;font-size:13px;color:#7a8079;">Word Atlas</p>
    </div>
    <div style="position:relative;width:64px;height:64px;flex-shrink:0;">
      <div style="width:64px;height:64px;border-radius:50%;background:#2fa8c6;overflow:hidden;position:relative;">
        <div style="position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:48px;height:34px;border-radius:24px 24px 0 0;background:#f7f2e6;"></div>
        <div style="position:absolute;top:14px;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;background:#f7f2e6;">
          <div style="position:absolute;top:11px;left:6px;width:3px;height:3px;border-radius:50%;background:#2a2a28;"></div>
          <div style="position:absolute;top:11px;right:6px;width:3px;height:3px;border-radius:50%;background:#2a2a28;"></div>
          <div style="position:absolute;top:17px;left:50%;transform:translateX(-50%);width:8px;height:3px;border-bottom:1.5px solid #a5764f;border-radius:0 0 8px 8px;"></div>
        </div>
        <div style="position:absolute;top:5px;left:50%;transform:translateX(-50%);width:30px;height:18px;border-radius:50% 50% 40% 40%;background:#132c4a;"></div>
        <div style="position:absolute;top:9px;left:calc(50% - 8px);width:5px;height:5px;border-radius:50%;background:#ffd93d;"></div>
        <div style="position:absolute;top:14px;left:calc(50% + 3px);width:3px;height:3px;border-radius:50%;background:#f7f2e6;"></div>
        <div style="position:absolute;top:8px;right:calc(50% - 11px);width:4px;height:4px;border-radius:50%;background:#f7f2e6;"></div>
        <div style="position:absolute;top:44px;left:50%;transform:translateX(-50%);width:38px;height:5px;background:#2fa8c6;border-radius:2px;"></div>
        <div style="position:absolute;top:2px;right:2px;width:6px;height:6px;background:#f7f2e6;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);"></div>
        <div style="position:absolute;top:20px;left:0;width:4px;height:4px;background:#f7f2e6;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);"></div>
      </div>
      <div style="position:absolute;bottom:-2px;right:-2px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid #eef4ef;display:flex;align-items:center;justify-content:center;">
        <div style="width:14px;height:14px;background:#2fa8c6;clip-path:polygon(50% 0%,60% 60%,100% 50%,50% 100%,40% 40%,0% 50%);"></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
